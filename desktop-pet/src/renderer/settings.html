<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self' file: data:; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' file: data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Desktop Pet Settings</title>
    <link rel="stylesheet" href="./styles/settings.css" />
  </head>
  <body>
    <main class="settings-shell">
      <header class="settings-header">
        <p class="settings-kicker">Desktop Pet</p>
        <h1>Settings</h1>
        <p class="settings-copy">
          Tune the backend address, startup behavior, and the desktop avatar. Changes apply immediately.
        </p>
      </header>

      <section class="settings-preview">
        <img id="avatarPreview" class="avatar-preview" alt="Avatar preview" />
        <div>
          <p class="preview-label">Current avatar</p>
          <strong id="avatarLabel">builtin:crabby</strong>
        </div>
      </section>

      <form id="settingsForm" class="settings-form">
        <label class="field">
          <span>Backend URL</span>
          <input id="backendUrl" type="text" />
        </label>

        <label class="field">
          <span>Avatar Asset</span>
          <input id="avatarAsset" type="text" />
        </label>

        <label class="field">
          <span>Pet Scale</span>
          <input id="petScale" type="range" min="0.75" max="1.4" step="0.05" />
          <strong id="scaleLabel">1.00x</strong>
        </label>

        <label class="switch-field">
          <span>Always On Top</span>
          <input id="alwaysOnTop" type="checkbox" />
        </label>

        <label class="switch-field">
          <span>Launch On Login</span>
          <input id="launchOnLogin" type="checkbox" />
        </label>

        <label id="showDockField" class="switch-field">
          <span>Show Dock Icon (macOS)</span>
          <input id="showDockIcon" type="checkbox" />
        </label>

        <div class="settings-actions">
          <button id="crabbyAvatar" class="ghost-button" type="button">
            Use Crabby Pack
          </button>
          <button id="legacyAvatar" class="ghost-button" type="button">
            Use Classic Avatar
          </button>
          <button class="save-button" type="submit">Save Changes</button>
        </div>
      </form>

      <p id="statusText" class="status-text" aria-live="polite"></p>
    </main>
    <script src="./settings.js"></script>
  </body>
  </html>
